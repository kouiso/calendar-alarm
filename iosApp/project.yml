# CalendarAlarm iOS — XcodeGen 定義
# `xcodegen generate` で iosApp.xcodeproj を再生する。
name: CalendarAlarm
options:
  bundleIdPrefix: com.calendaralarm
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # 自動署名の対象チーム（FAD の ad-hoc 配布は RITMO の ADP アカウントで行う）
    DEVELOPMENT_TEAM: ZZ4FA7NLUY

schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    test:
      config: Debug

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iosApp
        excludes:
          - Info.plist
          - CalendarAlarm.entitlements
    dependencies:
      - target: CalendarAlarmWidget
        embed: true
      - target: MailShareExt
        embed: true
    entitlements:
      path: iosApp/CalendarAlarm.entitlements
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Calendar Alarm
        CFBundleIdentifier: com.calendaralarm.ios
        UILaunchScreen_Generation: YES
        UIApplicationSceneManifest_Generation: YES
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCalendarsFullAccessUsageDescription: カレンダーの予定をアラームで鳴らすために読み取ります
        NSAlarmKitUsageDescription: 予定の時刻にアラームを鳴らすために使います
        NSUserNotificationsUsageDescription: 通知によるアラームのために使います
        # Xcode の Resources コピーは Fonts/ を展開してフラットに置くため
        # UIAppFonts は裸ファイル名で書く（Fonts/... だと FontParser が読めず全フォントが死ぬ）
        UIAppFonts:
          - plex_sans_jp_regular.ttf
          - plex_sans_jp_medium.ttf
          - plex_sans_jp_semibold.ttf
          - plex_sans_jp_light.ttf
        BGTaskSchedulerPermittedIdentifiers:
          - com.calendaralarm.resync
        UIBackgroundModes:
          - processing
        # 共有拡張から本体アプリを開くカスタムスキーム (メール→予定の受け渡し)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - calendaralarm-import
    preBuildScripts:
      - name: Build SharedKit (KMP)
        shell: /bin/sh
        script: |
          set -e
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode -q
    settings:
      base:
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
        OTHER_LDFLAGS: $(inherited) -framework SharedKit
        PRODUCT_BUNDLE_IDENTIFIER: com.calendaralarm.ios
        GENERATE_INFOPLIST_FILE: NO

  CalendarAlarmWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget
        excludes:
          - Info.plist
    entitlements:
      path: Widget/CalendarAlarmWidget.entitlements
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Calendar Alarm Widget
        CFBundleIdentifier: com.calendaralarm.ios.widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calendaralarm.ios.widget
        GENERATE_INFOPLIST_FILE: NO

  MailShareExt:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MailShareExt
        excludes:
          - Info.plist
          - MailShareExt.entitlements
    entitlements:
      path: MailShareExt/MailShareExt.entitlements
    info:
      path: MailShareExt/Info.plist
      properties:
        CFBundleIdentifier: com.calendaralarm.ios.shareext
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calendaralarm.ios.shareext
        GENERATE_INFOPLIST_FILE: NO
