# CalendarAlarm iOS — XcodeGen 定義
# `xcodegen generate` で iosApp.xcodeproj を再生する。
name: CalendarAlarm
options:
  bundleIdPrefix: com.calendaralarm
  # 文言の元は日本語。英語は各ターゲットの Localizable.xcstrings に持つ (#105)
  developmentLanguage: ja
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # 自動署名の対象チーム（FAD の ad-hoc 配布は RITMO の ADP アカウントで行う）
    DEVELOPMENT_TEAM: ZZ4FA7NLUY
    # AI 機能のキー。配布ビルドには入れない (局長決定 2026-10-17 の7)。
    # 開発者が手元で試す時だけ xcodebuild OPENROUTER_API_KEY=... で渡す
    OPENROUTER_API_KEY: ""
    # AdMob (#140)。未指定 = Google 公式のテストID。本番配信では xcodebuild 引数や
    # base 設定差し替えで実IDにする (開発・自動テストはテスト広告のみ)
    ADMOB_APP_ID: "ca-app-pub-3940256099942544~1458002511"
    ADMOB_BANNER_UNIT_ID: "ca-app-pub-3940256099942544/2934735716"

# 広告 (#140): Google Mobile Ads SDK + GDPR/EEA 同意 (UMP)。SPM で追加
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.11.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.1.0

schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iosAppTests

targets:
  # 予約エンジンの単体テスト。OS の予約は差し替えた偽物で、失敗や割り込みを再現する
  iosAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: unit-test
    dependencies:
      - target: iosApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.calendaralarm.ios.tests

  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iosApp
        excludes:
          - Info.plist
          - CalendarAlarm.entitlements
    dependencies:
      - target: CalendarAlarmWidget
        embed: true
      - target: MailShareExt
        embed: true
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    entitlements:
      path: iosApp/CalendarAlarm.entitlements
      properties:
        com.apple.security.application-groups: [group.com.calendaralarm.ios]
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Calendar Alarm
        CFBundleIdentifier: com.calendaralarm.ios
        OpenRouterAPIKey: $(OPENROUTER_API_KEY)
        # Info.plist を自前で持つ (GENERATE_INFOPLIST_FILE: NO) ので、*_Generation の鍵は効かない。
        # UILaunchScreen が無いと古い画面サイズ扱いになり、上下が黒い帯の縮小表示になる
        UILaunchScreen: {}
        UILaunchScreen_Generation: YES
        UIApplicationSceneManifest_Generation: YES
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCalendarsFullAccessUsageDescription: カレンダーの予定をアラームで鳴らすために読み取ります
        NSAlarmKitUsageDescription: 予定の時刻にアラームを鳴らすために使います
        NSUserNotificationsUsageDescription: 通知によるアラームのために使います
        # Xcode の Resources コピーは Fonts/ を展開してフラットに置くため
        # UIAppFonts は裸ファイル名で書く（Fonts/... だと FontParser が読めず全フォントが死ぬ）
        UIAppFonts:
          - plex_sans_jp_regular.ttf
          - plex_sans_jp_medium.ttf
          - plex_sans_jp_semibold.ttf
          - plex_sans_jp_light.ttf
          - outfit_extralight.ttf
          - outfit_light.ttf
          - outfit_regular.ttf
          - outfit_medium.ttf
          - outfit_semibold.ttf
        BGTaskSchedulerPermittedIdentifiers:
          - com.calendaralarm.resync
        UIBackgroundModes:
          - processing
        # 広告 (AdMob, #140)。開発・検証はテストID、本番は設定差し替え
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        AdMobBannerUnitID: $(ADMOB_BANNER_UNIT_ID)
        # AdMob の SKAdNetwork 計測 (最小限: Google 自身の識別子のみ)
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        # UMP 経由の ATT 許可を求める地域でだけ使われる説明文。許可不要地域では出ない
        NSUserTrackingUsageDescription: アラームを無料で提供するため、お住まいの地域の規則に沿って広告を表示します
        # 共有拡張から本体アプリを開くカスタムスキーム (メール→予定の受け渡し)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - calendaralarm-import
    preBuildScripts:
      - name: Build SharedKit (KMP)
        shell: /bin/sh
        script: |
          set -e
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode -q
    settings:
      base:
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
        OTHER_LDFLAGS: $(inherited) -framework SharedKit
        PRODUCT_BUNDLE_IDENTIFIER: com.calendaralarm.ios
        GENERATE_INFOPLIST_FILE: NO

  CalendarAlarmWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget
        excludes:
          - Info.plist
    entitlements:
      path: Widget/CalendarAlarmWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.calendaralarm.ios]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Calendar Alarm Widget
        CFBundleIdentifier: com.calendaralarm.ios.widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calendaralarm.ios.widget
        GENERATE_INFOPLIST_FILE: NO

  MailShareExt:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MailShareExt
        excludes:
          - Info.plist
          - MailShareExt.entitlements
    entitlements:
      path: MailShareExt/MailShareExt.entitlements
      properties:
        com.apple.security.application-groups: [group.com.calendaralarm.ios]
    info:
      path: MailShareExt/Info.plist
      properties:
        CFBundleIdentifier: com.calendaralarm.ios.shareext
        # appex は CFBundleDisplayName が無いと installd に拒否され install 失敗する
        CFBundleDisplayName: 予定に変換
        # 共有シートに出すために必須。テキスト/URL の共有を受け付ける
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionActivationRule: "SUBQUERY (extensionItems, $extensionItem, ANY $extensionItem.attachments.conformsToType UTI \"public.plain-text\" OR ANY $extensionItem.attachments.conformsToType UTI \"public.url\").@count > 0"
    # キーの無いビルドでは共有シートに「予定に変換」を出さない。出すと必ず失敗する入口になるため
    postBuildScripts:
      - name: Hide the share entry without an AI key
        script: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            /usr/libexec/PlistBuddy -c "Set :NSExtension:NSExtensionActivationRule FALSEPREDICATE" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calendaralarm.ios.shareext
        GENERATE_INFOPLIST_FILE: NO
