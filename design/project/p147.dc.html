<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>#147 アラーム音（iOS）</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/41384cd4ff5e02c5cffc251dcfb23a2b">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600&amp;family=Outfit:wght@200;300;400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.s52{display:flex;align-items:center;gap:8px;min-height:56px;border-bottom:1px solid var(--div)}
.s52:last-child{border-bottom:0}
.s52>.i{color:var(--mu);margin-right:4px}
</style>
</helmet>
<div class="r" data-theme="{{theme}}" style="width: 864px; height: 940px">

  <div class="col">
    <div class="cap">1. 今の形（iPhone） <span class="chip ok">実装あり</span></div>
    <div class="sub">「選ぶ」で iPhone のファイル選びが開き、選んだ音声をアラーム音にする</div>
    <div class="ph">
      <div class="top pl"><h2 class="h1 lg">設定</h2></div>
      <div class="body">
        <div class="card ls">
          <div class="s52"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg><p class="t grow">アラーム音: iPhone の標準</p><button class="ghost">選ぶ</button></div>
        </div>
        <p class="m" style="padding: 0 6px">音量・だんだん大きくする・バイブは、iPhone の「サウンドと触覚」の設定に従います。iPhone のアラーム機能では、アプリから変えられるのは音だけです。</p>
        <p class="m" style="padding: 0 6px">音を選んだ後は、その名前と「標準に戻す」が出る。</p>
      </div>
    </div>
  </div>

  <div class="col">
    <div class="cap">2. 同梱の音から選ぶ <span class="chip mu">未実装の案</span></div>
    <div class="sub">アプリに入れた音を並べて選ぶ案。音の名前と数は、入れる音が決まってから</div>
    <div class="ph">
      <div class="top"><button class="back" aria-label="戻る"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><h2 class="h1">アラーム音</h2></div>
      <div class="body">
        <div class="card ls">
          <div class="it"><span class="rad on"></span><p class="t grow">iPhone の標準</p></div>
          <div class="it"><span class="rad"></span><p class="t grow">[同梱の音 1]</p><button class="ghost"><svg class="i s f" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>聞く</button></div>
          <div class="it"><span class="rad"></span><p class="t grow">[同梱の音 2]</p><button class="ghost"><svg class="i s f" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>聞く</button></div>
          <div class="it"><span class="rad"></span><p class="t grow">[同梱の音 3]</p><button class="ghost"><svg class="i s f" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>聞く</button></div>
        </div>
        <button class="btn2">ファイルから選ぶ</button>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":864,"height":940}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme ?? 'dark' }; }
}
</script>
</body>
</html>
