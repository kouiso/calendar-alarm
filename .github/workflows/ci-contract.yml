name: CI contract test

# なぜ: scripts/ci.sh・Taskfile.yml・emulator スクリプトを直しても、emulator レーンや
#       陰性対照の判定が壊れたことに PR の CI では気づけなかった。契約テストを
#       これらを変える PR で回す (gradlew などは偽物なので Android SDK は要らない)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "scripts/ci.sh"
      - "scripts/emulator/**"
      - "scripts/test-ci-contract.sh"
      - "Taskfile.yml"
      - ".github/workflows/ci-contract.yml"
  push:
    branches:
      - master
    paths:
      - "scripts/ci.sh"
      - "scripts/emulator/**"
      - "scripts/test-ci-contract.sh"
      - "Taskfile.yml"
      - ".github/workflows/ci-contract.yml"

jobs:
  contract:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install go-task (pinned)
        uses: arduino/setup-task@v2
        with:
          version: 3.40.1
      - name: CI contract test
        run: bash scripts/test-ci-contract.sh
