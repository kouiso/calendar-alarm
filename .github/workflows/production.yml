name: Deploy to Firebase App Distribution from master

on:
  push:
    branches:
      - "master"

jobs:
  android_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Setup asdf
        uses: asdf-vm/actions/setup@v1

      - name: Install asdf plugins
        run: |
          asdf plugin add java
          asdf plugin add flutter

      - name: Install runtime versions
        run: asdf install

      - name: Authenticate with Firebase
        run: firebase login --reauth --token ${{ secrets.FIREBASE_TOKEN }}

      - name: Generate Firebase options
        run: flutterfire configure

      - name: Build APK
        run: flutter build apk --release

      - name: Get release notes
        id: release_notes
        run: |
          RELEASE_NOTES=""
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_NOTES=$(curl --silent "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" | jq -r .body)
          fi
          if [[ -z "${RELEASE_NOTES}" ]]; then
            RELEASE_NOTES="Commit: ${{ github.sha }}"
          fi
          echo "::set-output name=notes::${RELEASE_NOTES}"

      - name: Deploy APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: tester-group-android
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: ${{ steps.release_notes.outputs.notes }}

      - name: Deploy to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.example.app
          releaseFiles: build/app/outputs/apk/release/app-release.apk
          track: production

  ios_build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2

      - name: Setup asdf
        uses: asdf-vm/actions/setup@v1

      - name: Install asdf plugins
        run: |
          asdf plugin add flutter

      - name: Install runtime versions
        run: asdf install

      - name: Authenticate with Firebase
        run: firebase login --reauth --token ${{ secrets.FIREBASE_TOKEN }}

      - name: Generate Firebase options
        run: flutterfire configure

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build iOS app
        run: flutter build ios --release --no-codesign

      - name: Get release notes
        id: release_notes
        run: |
          RELEASE_NOTES=""
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_NOTES=$(curl --silent "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" | jq -r .body)
          fi
          if [[ -z "${RELEASE_NOTES}" ]]; then
            RELEASE_NOTES="Commit: ${{ github.sha }}"
          fi
          echo "::set-output name=notes::${RELEASE_NOTES}"

      - name: Deploy iOS app to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_IOS_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: tester-group-ios
          file: build/ios/iphoneos/Runner.app
          releaseNotes: ${{ steps.release_notes.outputs.notes }}

  macos_build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2

      - name: Setup asdf
        uses: asdf-vm/actions/setup@v1

      - name: Install asdf plugins
        run: |
          asdf plugin add flutter

      - name: Install runtime versions
        run: asdf install

      - name: Authenticate with Firebase
        run: firebase login --reauth --token ${{ secrets.FIREBASE_TOKEN }}

      - name: Generate Firebase options
        run: flutterfire configure

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Get release notes
        id: release_notes
        run: |
          RELEASE_NOTES=""
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_NOTES=$(curl --silent "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" | jq -r .body)
          fi
          if [[ -z "${RELEASE_NOTES}" ]]; then
            RELEASE_NOTES="Commit: ${{ github.sha }}"
          fi
          echo "::set-output name=notes::${RELEASE_NOTES}"

      - name: Deploy macOS app to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_MACOS_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: tester-group-macos
          file: build/macos/Build/Products/Release/Runner.app
          releaseNotes: ${{ steps.release_notes.outputs.notes }}
