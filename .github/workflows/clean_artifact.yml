name: 'artifacts cleanup'
on:
  schedule:
    - cron: '0 20 * * *' # UTC

jobs:
  delete-artifacts:
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    # 実測 cleanup は約13秒。ハング時の上限として 15 分を置く
    timeout-minutes: 15
    steps:
      - uses: kolpav/purge-artifacts-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          expire-in: 30 minutes
