name: Android CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

# push 直後の手動 dispatch で二重起動するのを防ぐ。同 ref の後続起動が先の実行を止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run shared tests (common + JVM + Android)
        run: ./gradlew :shared:jvmTest :shared:testDebugUnitTest --stacktrace

      - name: Run app unit tests
        run: ./gradlew :androidApp:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: calendar-alarm-debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 14
