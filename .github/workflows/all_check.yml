name: Android CI

# push は master のみ、作業ブランチは PR 経由で走らせる。全ブランチ push + PR の二重起動と、
# draft の途中コミット毎の実行を避けるため。
# 手動 dispatch で APK を取る運用はやめる (APK 配布は fad.yml が自前で再ビルドするので二重になる)。
# dispatch は CI の再実行用に残すだけ。
on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # WHY: master への連続 push で前の CI と APK 生成が打ち切られると、どのコミットが
  #      緑か分からなくなる。打ち切りは PR の古い実行だけに限る
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # push / dispatch では pull_request.draft が null なので != true で通す
    if: github.event.pull_request.draft != true
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run all unit tests and build debug APK
        run: bash scripts/ci.sh all

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: calendar-alarm-debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 14
